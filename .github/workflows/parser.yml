name: Auto RU Wayback Parser

on:
  workflow_dispatch: # Кнопка ручного запуска
  schedule:
    - cron: '0 */6 * * *' # Автозапуск каждые 6 часов

jobs:
  run-parser:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Дает права боту коммитить файлы назад в репозиторий

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RU Parser
        run: python parser.py

      - name: Commit & Push Parsed Articles
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add articles/
          git commit -m "Auto-parse: Добавлены новые русскоязычные статьи из Веб-Архива" || echo "Нет новых статей для коммита"
          git push
